name: Release

# Releases are intentional: pushing a YYYY.M.PATCH tag (e.g. 2026.7.0) builds
# the binaries and publishes the GitHub Release via goreleaser. Nothing runs on
# an ordinary push.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The single binary embeds the web UI; goreleaser's before-hook runs
      # scripts/build-ui.sh, which needs Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
